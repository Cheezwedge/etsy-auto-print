# Copy this file to config.toml and fill in your values.
# config.toml is gitignored — it holds your app keystring, so keep it private.

[etsy]
# Both values are on the same "Your Apps" page after creating a personal app:
# https://www.etsy.com/developers/your-apps
# Etsy requires both in every API request (as of Feb 9 2026) — the keystring
# alone is no longer enough.
keystring = "your-etsy-app-keystring"
shared_secret = "your-etsy-app-shared-secret"

# Optional: your numeric shop id. If omitted it is auto-discovered from the
# authenticated account on first use and cached in tokens.json.
# shop_id = 12345678

# The OAuth redirect is caught on http://localhost:<redirect_port>/callback.
# Register that exact URL as a Callback URL in your Etsy app settings.
redirect_port = 8231

[poll]
# How often `run` checks for new paid, unshipped orders.
interval_seconds = 180

[printer]
# "file"  — write packing slips into the outbox directory (no printer needed)
# "cups"  — send to a CUPS print queue via `lp` (once you have a printer)
backend = "file"
outbox = "outbox"
# cups_queue = "label"   # label queue, required when backend = "cups"
# slip_queue = "paper"   # optional second queue for packing slips (a regular
#                        # printer). If unset, slips stay in the outbox —
#                        # a raw ZPL label queue can't print plain text.

[paths]
db = "orders.db"
tokens = "tokens.json"

# ---------------------------------------------------------------------------
# Phase 2: automatic shipping label purchase via Shippo.
# Leave enabled = false to run packing slips only (phase 1 behavior).

[labels]
enabled = false
# Your Shippo API token. Use the TEST token (shippo_test_...) while developing:
# test labels are free, fake, and printable. Real postage additionally
# requires allow_live = true below — that's the safety interlock.
shippo_token = ""
allow_live = false
# Label format: PDF_4x6 (default, prints anywhere), PNG, or ZPLII (Zebra raw)
file_type = "PDF_4x6"
# Only consider rates from these carriers; empty list = cheapest of any.
allowed_providers = ["USPS"]

# Your return address (required when labels are enabled).
# email is required: USPS rejects purchases without a sender contact email.
[labels.ship_from]
name = "Your Shop Name"
street1 = "123 Your Street"
city = "Your City"
state = "OR"
zip = "97201"
country = "US"
email = "you@example.com"
# phone = "555-555-5555"   # required by some carriers/services

# The box every order ships in (single-box model for now).
# Weight sent to the carrier = packaging_oz + sum of item weights.
[labels.parcel]
length_in = 10.0
width_in = 7.0
height_in = 4.0
packaging_oz = 3.0
# Fallback per-item weight for SKUs not listed below. Omit this line to
# instead HOLD any order containing an unmapped SKU (safer).
# default_item_oz = 8.0

# Per-SKU item weights in ounces.
[labels.item_weights_oz]
# "MUG-BLUE-12OZ" = 14.0
# "STAND-WAL" = 9.5

# ---------------------------------------------------------------------------
# Phase 3: get a push notification when an order is held and needs you.
# Pick any hard-to-guess topic name and subscribe to it in the ntfy app
# (https://ntfy.sh — free, no account needed) on your phone or browser.

[notify]
# Either or both may be set — every configured channel gets every alert.
# ntfy.sh: https://ntfy.sh/your-secret-topic-name (pick a hard-to-guess name;
# ntfy.sh is a public server, so the topic name is effectively a password).
# ntfy_url = "https://ntfy.sh/your-secret-topic-name"

# Pushover: pushover.net -> your dashboard for the user key, and
# pushover.net/apps/build to create an application for the api token.
# pushover_user_key = "your-pushover-user-key"
# pushover_api_token = "your-pushover-app-api-token"
