# Copy this file to config.toml and fill in your values.
# config.toml is gitignored — it holds your app keystring, so keep it private.

[etsy]
# Both values are on the same "Your Apps" page after creating a personal app:
# https://www.etsy.com/developers/your-apps
# Etsy requires both in every API request (as of Feb 9 2026) — the keystring
# alone is no longer enough.
keystring = "your-etsy-app-keystring"
shared_secret = "your-etsy-app-shared-secret"

# Optional: your numeric shop id. If omitted it is auto-discovered from the
# authenticated account on first use and cached in tokens.json.
# shop_id = 12345678

# The OAuth redirect is caught on http://localhost:<redirect_port>/callback.
# Register that exact URL as a Callback URL in your Etsy app settings.
redirect_port = 8231

[poll]
# How often `run` checks for new paid, unshipped orders.
interval_seconds = 180

[printer]
# "file"  — write packing slips into the outbox directory (no printer needed)
# "cups"  — send to a CUPS print queue via `lp` (once you have a printer)
backend = "file"
outbox = "outbox"
# cups_queue = "label"   # label queue, required when backend = "cups"
#
# Where the packing slip goes. Pick ONE of:
#
#   slip_format = "zpl"    Print the slip on the LABEL printer as a 4x6 label,
#                          immediately before that order's shipping label, so
#                          the two come out as a pair. Best if the label
#                          printer is the only printer you have — a shipping
#                          label carries no SKU, so without this there is
#                          nothing tying a label to what goes in the box.
#
#   slip_queue = "paper"   Print slips on a second CUPS queue (a regular
#                          printer) as plain text.
#
# With neither, slips are written to the outbox as .txt files and never
# printed: a raw ZPL label queue cannot render plain text.
# slip_format = "zpl"
# slip_queue = "paper"

[paths]
db = "orders.db"
tokens = "tokens.json"

# ---------------------------------------------------------------------------
# Phase 2: automatic shipping label purchase via Shippo.
# Leave enabled = false to run packing slips only (phase 1 behavior).

[labels]
enabled = false
# Your Shippo API token. Use the TEST token (shippo_test_...) while developing:
# test labels are free, fake, and printable. Real postage additionally
# requires allow_live = true below — that's the safety interlock.
shippo_token = ""
allow_live = false
# Label format: PDF_4x6 (default, prints anywhere), PNG, or ZPLII (Zebra raw)
file_type = "PDF_4x6"
# Only consider rates from these carriers; empty list = cheapest of any.
allowed_providers = ["USPS"]

# --- Faster shipping the buyer paid extra for.
#
# By default the cheapest allowed rate is bought. That is wrong when a buyer
# paid for a shipping upgrade: they paid for Priority Mail Express, they
# should not get Ground Advantage. Etsy reports the upgrade's name on the
# order, and [labels.service_map] translates that name into the Shippo
# service to buy.
#
# Etsy's six standard USPS services are mapped out of the box, so if your
# upgrades use their default names there is nothing to do here. Add a line
# only for a name your shipping profile spells differently:
#
# [labels.service_map]
# "Express (2 day)" = "usps_priority_express"    # your profile's wording
#
# Left of "=" is exactly what Etsy calls it (case and spacing don't matter);
# right of "=" is the Shippo service token. List the real tokens your account
# quotes with:  etsy-auto-print services
#
# An order whose upgrade isn't mapped is HELD rather than shipped as the
# cheapest option — you paid for the buyer's choice or you hear about it.
# Set this to false to ship the cheapest rate and just log a warning instead.
# hold_unmapped_upgrade = true

# Buyer addresses are checked with the carrier before postage is bought, and
# an address that fails is HELD rather than shipped into the void. Carriers do
# sometimes fail to recognise genuinely deliverable addresses (new builds,
# rural routes) — set this to false if that becomes a nuisance.
# validate_addresses = true

# Your return address (required when labels are enabled).
# email is required: USPS rejects purchases without a sender contact email.
[labels.ship_from]
name = "Your Shop Name"
street1 = "123 Your Street"
city = "Your City"
state = "OR"
zip = "97201"
country = "US"
email = "you@example.com"
# phone = "555-555-5555"   # required by some carriers/services

# --- Option A: one box for every order (simplest — use this if everything
# you sell fits comfortably in one box size). Weight sent to the carrier =
# packaging_oz + sum of item weights.
[labels.parcel]
length_in = 10.0
width_in = 7.0
height_in = 4.0
packaging_oz = 3.0
# Optional: how many items this box holds. Weight scales with quantity
# automatically; box dimensions do not. With only one box configured,
# exceeding this HOLDS the order — see Option B to step up to a bigger box
# instead.
# max_items = 4
# Fallback per-item weight for SKUs not listed below. Omit this line to
# instead HOLD any order containing an unmapped SKU (safer).
# default_item_oz = 8.0

# --- Option B: multiple box sizes, chosen per order by what's in it.
# Delete [labels.parcel] above and uncomment this block instead — the two
# options are mutually exclusive (parcels, if present, wins).
#
# Each SKU maps to a named preset in [labels.item_parcels]. An order with
# items from more than one preset ships in the single LARGEST of them (by
# volume) — weight still sums every item into that one box. A SKU with no
# mapping falls back to default_parcel, or gets HELD for review if that's
# also unset.
#
# max_items turns these presets into a ladder: when an order outgrows the box
# its SKU maps to, the SMALLEST configured box that does hold that many is
# used instead, with that box's own packaging_oz. Only when nothing fits is
# the order held. So "one pack per mailer, two packs go in the bigger one"
# is just two presets — no rule to write.
#
# default_parcel = "medium"
#
# [labels.parcels.small]
# length_in = 6.0
# width_in = 4.0
# height_in = 2.0
# packaging_oz = 1.0
# max_items = 4        # optional: how many items fit (box dimensions don't
#                      # grow with quantity — 10 mugs don't fit in a 1-mug
#                      # box). Outgrowing it steps up to the next box.
#
# [labels.parcels.medium]
# length_in = 10.0
# width_in = 7.0
# height_in = 4.0
# packaging_oz = 3.0
#
# [labels.parcels.large]
# length_in = 14.0
# width_in = 10.0
# height_in = 6.0
# packaging_oz = 5.0
#
# [labels.item_parcels]
# "STICKER-PACK" = "small"
# "MUG-BLUE-12OZ" = "medium"
# "LARGE-VASE" = "large"

# --- Per-SKU data: spreadsheet or inline, your choice (or both).
#
# Option 1 — a spreadsheet (easiest once you have more than a few products).
# Edit it in Excel/LibreOffice/Google Sheets, export as CSV. Needs a header
# row with a "sku" column, plus "weight_oz" and optionally "parcel". Extra
# columns (notes, price, ...) are ignored, so one sheet can do double duty.
#
# weight_oz is per item SOLD, not per unit: if the listing is a pack of four,
# it's the weight of all four. Quantity then multiplies that — someone buying
# 2 of a 4-pack ships 8 units' worth.
# See items.example.csv.
# items_csv = "items.csv"
#
# Option 2 — inline here. Anything listed below overrides the CSV, which is
# handy for a one-off tweak without touching the sheet.
[labels.item_weights_oz]
# "MUG-BLUE-12OZ" = 14.0
# "STAND-WAL" = 9.5

# ---------------------------------------------------------------------------
# Watch for listings that have sold out or are about to.
#
# A sold-out listing is silent: no order arrives, nothing errors, and the
# order pipeline has nothing to notice. The shop is just shut for that item
# until you happen to look. Note that a cancelled order does NOT restore the
# quantity — Etsy decrements it when the order is placed, so a listing at 1
# is sold out the moment someone buys, cancellation or not.
#
# Needs the listings_r scope for exact numbers; without it a sell-out can
# only be inferred from a listing disappearing. Re-run `auth` to grant it.

[stock]
enabled = true          # sweep listings and alert on stock (default true)
low_threshold = 2       # warn at or below this quantity (0 = only on sold out)
interval_minutes = 60   # how often to sweep; minimum 5

# Phase 3: get a push notification when an order is held and needs you.
# Pick any hard-to-guess topic name and subscribe to it in the ntfy app
# (https://ntfy.sh — free, no account needed) on your phone or browser.

[notify]
# Either or both may be set — every configured channel gets every alert.
# ntfy.sh: https://ntfy.sh/your-secret-topic-name (pick a hard-to-guess name;
# ntfy.sh is a public server, so the topic name is effectively a password).
# ntfy_url = "https://ntfy.sh/your-secret-topic-name"

# Pushover: pushover.net -> your dashboard for the user key, and
# pushover.net/apps/build to create an application for the api token.
# pushover_user_key = "your-pushover-user-key"
# pushover_api_token = "your-pushover-app-api-token"

# ---------------------------------------------------------------------------
# Web dashboard (etsy-auto-print dashboard): status, config/product editing,
# logs, and test buttons.
#
# It binds to localhost by default — reach it from a laptop with an SSH
# tunnel, which needs no password:
#     ssh -L 8765:localhost:8765 you@your-pi
#     then open http://localhost:8765
#
# To open it to your home network instead (--host 0.0.0.0), a password is
# REQUIRED: the page displays API tokens that can spend real money.

[dashboard]
# password = "pick-something-long"
