[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etsy-auto-print"
version = "0.1.0"
description = "Automatically print packing slips (and later shipping labels) for Etsy orders"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
etsy-auto-print = "etsy_auto_print.cli:main"

[tool.setuptools.packages.find]
include = ["etsy_auto_print*"]
